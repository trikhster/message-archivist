name: Release

# Push a tag like v0.0.2.0 (made after `npm run set-version`, see notes/Releasing.md) to publish a
# GitHub Release with the packaged extension and the signed Android APK attached.
# Versions 0.x are pre-production, so their releases are marked as pre-releases.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

# Third-party actions are pinned to a commit (the tag it was in a comment).
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Tag must match the manifest version
        run: |
          manifest=$(node -p "require('./extension/manifest.json').version")
          if [ "v$manifest" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$manifest"
            exit 1
          fi
      - name: Build the extension zip
        run: npm run package
      - name: The Gradle wrapper is Gradle's own
        uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 17
      # The key is only on disk for this step; the secrets are set by the owner (notes/Releasing.md).
      # Without them the release goes out with the extension only, and the owner attaches an
      # APK signed on their own computer.
      - name: Build the signed APK
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          MA_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$MA_KEYSTORE_PASSWORD" ]; then
            echo "::warning::The signing key secrets aren't set, so this release has no APK; attach one signed locally (notes/Releasing.md)."
            exit 0
          fi
          export MA_KEYSTORE="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$MA_KEYSTORE"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$MA_KEYSTORE"
          ./gradlew assembleRelease --console=plain
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner"
          "$apksigner" verify --print-certs "$apk" | tee ../signer.txt
          cp "$apk" "../dist/message-archivist-android-$GITHUB_REF_NAME.apk"
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          guide="https://github.com/${GITHUB_REPOSITORY}/blob/main/extension/README.md"
          app="https://github.com/${GITHUB_REPOSITORY}#the-android-app"
          {
            echo "**Chrome extension:** download \`message-archivist-extension-$GITHUB_REF_NAME.zip\` below and unzip it. In Chrome, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and choose the unzipped folder. Updating? Replace the folder's contents, click the reload icon on the extension, then reload your Google Messages tab. [User guide]($guide)"
            echo ""
            echo "**Android app:** download \`message-archivist-android-$GITHUB_REF_NAME.apk\` below on your phone and open it; Android asks to allow installing apps from your browser or Files. A newer version installs over this one. [How to use it]($app)"
            echo ""
            echo "---"
          } > release-notes.md
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md >> release-notes.md
          {
            echo ""
            echo "SHA-256 of the zip: \`$(sha256sum dist/*.zip | cut -d' ' -f1)\`"
            echo ""
            if ls dist/*.apk >/dev/null 2>&1; then
              echo "SHA-256 of the APK: \`$(sha256sum dist/*.apk | cut -d' ' -f1)\`"
              echo ""
              echo "APK signing certificate SHA-256: \`$(grep -m1 'certificate SHA-256 digest' signer.txt | sed 's/.*: //')\`"
            else
              echo "The APK is signed on the maintainer's computer and attached separately, with its SHA-256 and signing-certificate fingerprint."
            fi
          } >> release-notes.md
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: |
            dist/*.zip
            dist/*.apk
