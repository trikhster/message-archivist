name: App

# Publishes the app (app/ with the extension's pages, put together by
# scripts/build-app.mjs) to GitHub Pages when a release tag like v0.0.2.0 is
# pushed, so what's served is always exactly a release. Pages has to be turned
# on once (Source: GitHub Actions), with the github-pages environment allowing
# v* tags: see notes/Releasing.md.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

# Third-party actions are pinned to a commit (the tag it was in a comment).
jobs:
  build:
    # Run by hand, it has to be given a release tag ("Use workflow from" → Tags).
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tag must match the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi
      - name: Check and test
        run: npm run check && npm test
      - name: Build the app
        run: npm run app -- _site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}app/
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
