name: Bug report
description: Something went wrong or a backup came out incomplete.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Please don't post anything private.** Logs contain chat names, contact names and phone numbers (never message text). Replace them with placeholders such as "Contact A" and "(555) 555-0100" before pasting, and never attach real messages or backup files.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown in Settings, under the title.
      placeholder: "0.4.1.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 155 on macOS 26"
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log (with names and numbers removed)
      description: Click "Copy log" on the progress panel, or Settings → More settings → Past runs → Copy log.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed names, phone numbers and anything else private from what I posted.
          required: true
