# Proposes updates to the pinned GitHub Actions and the Android app's
# Gradle dependencies, one grouped pull request each a month. The extension
# has no dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: ["*"]
